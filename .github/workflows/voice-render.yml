# Máy sinh giọng đọc (Hưng chốt GitHub Actions 24/10; làm 03/11 — spec build/spec-kho-anh-giong-2026-10-24.md mục 4.6).
# BE gọi workflow_dispatch khi Editor bấm "Sinh giọng" (POST /api/studio/chapters/{code}/voice). Runner lấy việc PENDING,
# sinh bằng VieNeu (bản pin chạy được ở spike 19/10, run 39182973294), nộp mp3 vào BE. Câu trùng khoá BE đã bỏ qua từ trước.
# Repo công khai → log công khai: worker chỉ in khoá câu + giọng, không in bí mật.
# 03/11: máy TRỰC SẴN (cách clawd-tts): dựng 1 lần, hỏi việc mỗi 2 s, tắt sau VOICE_IDLE_MIN phút không có việc; BE thấy
# máy đang trực thì không gọi dựng thêm. Không apt ffmpeg (mp3 bằng lameenc), pip cache theo voice/requirements.txt.
name: voice-render
on:
  workflow_dispatch:
concurrency:
  group: voice-render          # một lượt chạy + một lượt chờ; lượt chờ lấy nốt việc xếp thêm
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      VOICE_IDLE_MIN: '20'
      FINTEEN_API: https://kidzeconomy.com.vn/finteen
      VOICE_WORKER_KEY: ${{ secrets.VOICE_WORKER_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            voice
            src/main/resources/voice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: voice/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-vieneu-3.4.0
      - run: pip install -q -r voice/requirements.txt
      - run: python voice/worker.py
