# Giữ cho server free không ngủ.
#
# Koyeb free tắt máy sau 1 GIỜ không có traffic và KHÔNG cho tắt tính năng đó.
# Ping 20 phút một lần là vẫn thức, kể cả khi GitHub chạy cron trễ 10–15 phút
# (cron của GitHub hay trễ vào giờ cao điểm — đó là lý do chọn 20 phút chứ không phải 55).
#
# Repo này PUBLIC nên GitHub Actions không tính phút. Repo private thì việc này
# ăn hết quota 2000 phút/tháng — lúc đó chuyển sang cron-job.org hoặc UptimeRobot.
name: keepalive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          BE_URL: ${{ vars.BE_URL }}
        run: |
          if [ -z "$BE_URL" ]; then
            echo "Chưa đặt biến repo BE_URL — bỏ qua."
            echo "Đặt ở Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 60 "$BE_URL/api/health")
          cat /tmp/out; echo
          # Thất bại thì để job ĐỎ. Im lặng nuốt lỗi thì tháng sau mới biết server chết.
          [ "$code" = "200" ] || { echo "health trả $code"; exit 1; }
