# Chạy test mỗi lần push. BE chạy trên VPS Vietnix và deploy BẰNG TAY qua
# ops/finteen-deploy/redeploy.sh (thư mục đồ án) — main đổi không tự lên máy chủ.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: mvn -B test
