spring.application.name=doan-game-backend
# PORT: cac nen tang free (Koyeb, Render, Railway...) tu bom bien nay va bat app
# phai nghe dung cong do. Chay o may thi khong co bien -> ve 8080 nhu cu.
server.port=${PORT:8080}
# Rong o may. Tren VPS dat /finteen de nginx day thang qua, khoi rewrite duong dan
# (springdoc tu gan tien to nay vao swagger, khong phai sua gi them).
server.servlet.context-path=${CONTEXT_PATH:}
app.build-version=${BUILD_VERSION:dev}

# Khoa ky JWT. Toi thieu 32 ky tu, app tu chet luc khoi dong neu ngan hon.
# Mac dinh chi de chay o may. Deploy thi BAT BUOC dat bien JWT_SECRET.
app.jwt.secret=${JWT_SECRET:doi-khoa-nay-truoc-khi-deploy-that-nhe-32-ky-tu}
app.jwt.adult-ttl-hours=${JWT_ADULT_TTL_HOURS:168}
app.jwt.child-ttl-hours=${JWT_CHILD_TTL_HOURS:8}

# Mac dinh: H2 trong bo nho -> clone ve la chay duoc ngay, khong can cai gi.
# Postgres that thi dat 3 bien moi truong o duoi, KHONG sua file nay.
spring.datasource.url=${DB_URL:jdbc:h2:mem:doan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger
