spring.application.name=doan-game-backend
server.port=8080
app.build-version=${BUILD_VERSION:dev}

# Mac dinh: H2 trong bo nho -> clone ve la chay duoc ngay, khong can cai gi.
# Postgres that thi dat 3 bien moi truong o duoi, KHONG sua file nay.
spring.datasource.url=${DB_URL:jdbc:h2:mem:doan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger
